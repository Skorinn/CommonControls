#
# Revision History:
#=====================================================================================================================
# 2026/09/02 - Mike Pullen - Original implementation.
# 2026/09/03 - Mike Pullen - Required the tag to be reachable from master, and moved publishing into a separate job
#                            gated by the release environment.
# 2026/09/04 - Mike Pullen - Updated the actions to their current major versions.
#**********************************************************************************************************************
name: Release

on:
  # Publish a release whenever a version tag is pushed
  push:
    tags:
      - 'v*'

  # Allow a dry run from the Actions tab, which builds and packages but does not publish
  workflow_dispatch:

# Building needs no more than read access, so the publish job asks for write on its own
permissions:
  contents: read

jobs:
  build:
    name: Build and package
    runs-on: windows-latest

    # Hand the version to the publish job, which never checks out the source
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # Get the source, with the full history the ancestry check needs
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The project is a legacy csproj targeting .NET Framework 4.8, so it needs MSBuild rather than the dotnet CLI
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      # The assembly is the single source of truth for the version number
      - name: Read the version from AssemblyInfo.cs
        id: version
        shell: pwsh
        run: |
          $assemblyInfo = Get-Content 'Properties\AssemblyInfo.cs' -Raw

          # Fail early if the informational version is missing or malformed
          if ($assemblyInfo -notmatch 'AssemblyInformationalVersion\("([^"]+)"\)')
          {
              throw 'Could not find AssemblyInformationalVersion in Properties\AssemblyInfo.cs.'
          }

          $version = $Matches[1]
          Write-Host "Assembly version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      # A tag that disagrees with the assembly would ship a mislabelled binary, so refuse to build one
      - name: Verify the tag matches the assembly version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $expected = 'v${{ steps.version.outputs.version }}'

          # Stop the release rather than publish a binary whose version does not match its tag
          if ($tag -ne $expected)
          {
              throw "Tag '$tag' does not match the assembly version. Expected '$expected'."
          }

          Write-Host "Tag '$tag' matches the assembly version."

      # Releases are cut from master, so a tag on unmerged work must not reach the publish job
      - name: Verify the tag is reachable from master
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # The checkout only fetched the tag, so fetch the release branch to compare against
          git fetch origin +refs/heads/master:refs/remotes/origin/master --quiet

          if ($LASTEXITCODE -ne 0)
          {
              throw 'Could not fetch master to check the tag against.'
          }

          # An unmerged commit would publish code that is not on the release branch
          git merge-base --is-ancestor HEAD origin/master

          if ($LASTEXITCODE -ne 0)
          {
              throw "Tag '${{ github.ref_name }}' is not reachable from master. Merge to master before tagging."
          }

          Write-Host "Tag '${{ github.ref_name }}' is reachable from master."

      # Build the release configuration, treating warnings as errors so nothing undocumented ships
      - name: Build
        run: msbuild CommonControls.sln -p:Configuration=Release -p:TreatWarningsAsErrors=true -m

      # Collect the binary, the IntelliSense documentation, and the legal and usage files
      - name: Package the build output
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $stagingDirectory = "package\CommonControls-$version"

          # Stage the files that make up the download
          New-Item -ItemType Directory -Path $stagingDirectory -Force | Out-Null
          Copy-Item 'bin\Release\CommonControls.dll' $stagingDirectory
          Copy-Item 'bin\Release\CommonControls.xml' $stagingDirectory
          Copy-Item 'LICENSE' $stagingDirectory
          Copy-Item 'README.md' $stagingDirectory

          # Compress the staged files into the release asset
          Compress-Archive -Path "$stagingDirectory\*" -DestinationPath "package\CommonControls-$version.zip" -Force
          Write-Host "Packaged package\CommonControls-$version.zip"

      # Hand the package to the publish job, and keep it on a dry run so it stays inspectable
      - name: Upload the package as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: CommonControls-${{ steps.version.outputs.version }}
          path: package\CommonControls-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: windows-latest

    # Only a tagged build publishes, so a manual run stops after packaging
    if: startsWith(github.ref, 'refs/tags/')

    # The environment holds the manual approval and restricts which refs may publish
    environment: release

    # Creating a release is the only step that writes to the repository
    permissions:
      contents: write

    steps:
      # Take the package built and checked by the previous job rather than rebuilding it
      - name: Download the package
        uses: actions/download-artifact@v8
        with:
          name: CommonControls-${{ needs.build.outputs.version }}
          path: package

      # Publish the release from the tag that triggered the run
      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = '${{ needs.build.outputs.version }}'
          $archive = "package\CommonControls-$version.zip"
          $summary = "CommonControls $version for .NET Framework 4.8. Download the zip below, reference CommonControls.dll from your Windows Forms project, and keep CommonControls.xml beside it for IntelliSense documentation."

          # Create the release from the tag, attaching the package and appending the generated change log
          gh release create '${{ github.ref_name }}' $archive --title "CommonControls $version" --notes $summary --generate-notes --verify-tag
